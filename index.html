<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dennika's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ */
/* Dennika's Dashboard — playful pink                                 */
/* ------------------------------------------------------------------ */

:root {
  /* Strawberry Cream (default theme) — vars overridden by Tweaks */
  --bg: #fdf3ef;
  --bg-soft: #fbe7e0;
  --card: #ffffff;
  --card-2: #fff7f3;
  --ink: #3a1d28;
  --ink-soft: #6b4250;
  --muted: #a98591;
  --line: #f3d9d9;
  --line-soft: #f7e7e7;

  --primary: #e8527a;
  --primary-soft: #fbd7e1;
  --primary-deep: #b1325c;

  --accent-1: #f4a261;    /* peach */
  --accent-1-soft: #fde3cf;
  --accent-2: #88b896;    /* sage mint */
  --accent-2-soft: #d8ecdc;
  --accent-3: #b39bd8;    /* lilac */
  --accent-3-soft: #ebe1f5;
  --accent-4: #f7c548;    /* sunny */
  --accent-4-soft: #fdecbc;

  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;

  --shadow-sm: 0 1px 2px rgba(58, 29, 40, 0.06);
  --shadow: 0 6px 20px -8px rgba(177, 50, 92, 0.18), 0 2px 4px rgba(58, 29, 40, 0.04);
  --shadow-lg: 0 18px 40px -16px rgba(177, 50, 92, 0.28);

  --font-serif: "Instrument Serif", "Times New Roman", serif;
  --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; cursor: pointer; }
button svg { pointer-events: none; }
input, textarea { font-family: inherit; color: inherit; }

/* ----- App shell ----- */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at -10% -10%, var(--primary-soft) 0%, transparent 55%),
    radial-gradient(900px 500px at 110% 10%, var(--accent-3-soft) 0%, transparent 55%),
    var(--bg);
}

/* ----- Sidebar ----- */
.sidebar {
  padding: 22px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-right: 1px solid var(--line);
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 18px;
}
.sidebar__brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--accent-1));
  display: grid;
  place-items: center;
  color: white;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 22px;
  box-shadow: var(--shadow);
}
.sidebar__brand-name {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 22px;
  line-height: 1;
  color: var(--ink);
}
.sidebar__brand-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}
.sidebar__section-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 14px 10px 6px;
}
.sidebar__item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 12px;
  color: var(--ink-soft);
  font-weight: 500;
  font-size: 13.5px;
  background: transparent;
  border: 0;
  text-align: left;
  width: 100%;
  transition: background 0.15s, color 0.15s;
}
.sidebar__item:hover { background: var(--card-2); color: var(--ink); }
.sidebar__item--active {
  background: var(--primary);
  color: white;
  box-shadow: var(--shadow);
}
.sidebar__item--active:hover { background: var(--primary); color: white; }
.sidebar__item-icon {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.sidebar__item-badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--primary-soft);
  color: var(--primary-deep);
  padding: 2px 7px;
  border-radius: 999px;
}
.sidebar__item--active .sidebar__item-badge {
  background: rgba(255,255,255,0.25);
  color: white;
}
.sidebar__footer {
  margin-top: auto;
  padding: 14px 10px 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar__avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-3), var(--primary));
  color: white;
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 18px;
}
.sidebar__user {
  font-weight: 600;
  color: var(--ink);
  font-size: 13px;
}
.sidebar__streak {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.05em;
}

/* ----- Main ----- */
.main {
  padding: 28px 36px 80px;
  min-width: 0;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 20px;
  flex-wrap: wrap;
}
.page-head > *:first-child { flex: 1 1 320px; min-width: 0; }
.page-head > *:last-child { flex-shrink: 0; flex-wrap: wrap; }
.page-head__title {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 44px;
  line-height: 1;
  color: var(--ink);
  margin: 0;
}
.page-head__greeting {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.page-head__date {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
}

/* ----- Cards ----- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow-sm);
}
.card--tinted { background: var(--card-2); }
.card--pink { background: var(--primary-soft); border-color: transparent; }
.card--mint { background: var(--accent-2-soft); border-color: transparent; }
.card--peach { background: var(--accent-1-soft); border-color: transparent; }
.card--lilac { background: var(--accent-3-soft); border-color: transparent; }
.card--sun { background: var(--accent-4-soft); border-color: transparent; }
.card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.card__head > *:first-child { min-width: 0; flex: 1 1 auto; }
.card__head > *:last-child:not(:first-child) { flex-shrink: 0; }
.card__title {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 22px;
  line-height: 1.1;
  margin: 0;
  color: var(--ink);
  overflow-wrap: break-word;
}
.card__sub {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ----- Bento ----- */
.bento {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}
.bento > * { min-width: 0; }
.col-3  { grid-column: span 3; }
.col-4  { grid-column: span 4; }
.col-5  { grid-column: span 5; }
.col-6  { grid-column: span 6; }
.col-7  { grid-column: span 7; }
.col-8  { grid-column: span 8; }
.col-9  { grid-column: span 9; }
.col-12 { grid-column: span 12; }

/* ----- Tasks ----- */
.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 6px;
  border-bottom: 1px dashed var(--line);
}
.task:last-child { border-bottom: 0; }
.task__check {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 1.5px solid var(--line);
  background: var(--card);
  display: grid;
  place-items: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.task__check:hover { border-color: var(--primary); background: var(--primary-soft); }
.task__check--done {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.task__text {
  flex: 1;
  font-size: 14px;
  color: var(--ink);
}
.task--done .task__text { color: var(--muted); text-decoration: line-through; }
.task__meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ----- Pills / Tags ----- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  background: var(--card-2);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.pill--pink   { background: var(--primary-soft); color: var(--primary-deep); border-color: transparent; }
.pill--mint   { background: var(--accent-2-soft); color: #3d6b4f; border-color: transparent; }
.pill--peach  { background: var(--accent-1-soft); color: #8b4f1c; border-color: transparent; }
.pill--lilac  { background: var(--accent-3-soft); color: #5e4b85; border-color: transparent; }
.pill--sun    { background: var(--accent-4-soft); color: #8a6a16; border-color: transparent; }
.pill--mono   { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }

/* ----- Progress ----- */
.bar {
  height: 8px;
  background: var(--line-soft);
  border-radius: 999px;
  overflow: hidden;
}
.bar__fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent-1));
  border-radius: inherit;
  transition: width 0.4s ease;
}

/* ----- Buttons ----- */
.btn {
  border: 0;
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 13px;
  background: var(--ink);
  color: var(--card);
  transition: transform 0.1s, background 0.15s;
}
.btn:hover { transform: translateY(-1px); }
.btn--pink { background: var(--primary); color: white; }
.btn--ghost { background: transparent; color: var(--ink-soft); }
.btn--ghost:hover { background: var(--card-2); }
.btn--icon {
  width: 30px;
  height: 30px;
  padding: 0;
  display: grid;
  place-items: center;
  background: var(--card-2);
  color: var(--ink-soft);
}
.btn--icon:hover { background: var(--primary-soft); color: var(--primary-deep); }

/* ----- Habit grid ----- */
.habit-grid {
  display: grid;
  gap: 6px;
}
.habit-row {
  display: grid;
  grid-template-columns: 180px repeat(7, minmax(0, 1fr)) 60px;
  gap: 8px;
  align-items: center;
}
.habit-row__head {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  font-weight: 500;
}
.habit-row__icon {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 15px;
  flex-shrink: 0;
}
.habit-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1.5px dashed var(--line);
  background: var(--card);
  display: grid;
  place-items: center;
  transition: all 0.12s;
  font-size: 12px;
  color: var(--muted);
}
.habit-cell:hover { border-color: var(--primary); border-style: solid; }
.habit-cell--done {
  border-style: solid;
  border-color: transparent;
  color: white;
  font-weight: 700;
}
.habit-cell--today {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.habit-row__score {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-soft);
}
.habit-day-head {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
}

/* ----- Phone preview ----- */
.phone {
  background: linear-gradient(180deg, #1a1014 0%, #2a181f 100%);
  border-radius: 28px;
  padding: 14px 12px 16px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 280px;
  margin: 0 auto;
}
.phone__notch {
  width: 80px;
  height: 18px;
  background: #000;
  border-radius: 999px;
  margin: -4px auto 12px;
}
.phone__bubble {
  background: var(--primary-soft);
  border-radius: 18px 18px 18px 4px;
  padding: 12px 14px;
  font-size: 12.5px;
  color: var(--ink);
  white-space: pre-line;
  line-height: 1.55;
}
.phone__time {
  text-align: center;
  font-family: var(--font-mono);
  color: rgba(255,255,255,0.5);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.phone__handle {
  text-align: center;
  font-family: var(--font-mono);
  color: rgba(255,255,255,0.7);
  font-size: 11px;
  margin-bottom: 10px;
}

/* ----- Mood ----- */
.mood-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}
.mood-pick {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.mood-emoji {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: var(--card-2);
  border: 1.5px solid transparent;
  transition: transform 0.1s, border-color 0.15s, background 0.15s;
}
.mood-emoji:hover { transform: scale(1.08); }
.mood-emoji--active {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.mood-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ----- Calendar / agenda ----- */
.agenda-item {
  display: grid;
  grid-template-columns: 60px 4px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}
.agenda-item:last-child { border-bottom: 0; }
.agenda-time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  text-align: right;
}
.agenda-bar {
  width: 4px;
  height: 28px;
  border-radius: 4px;
}
.agenda-title { font-size: 14px; font-weight: 500; color: var(--ink); }
.agenda-meta { font-size: 11.5px; color: var(--muted); }

/* ----- Finance ----- */
.cc {
  border-radius: 18px;
  padding: 16px;
  color: white;
  background: linear-gradient(135deg, var(--primary), var(--accent-1));
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 130px;
  position: relative;
  overflow: hidden;
}
.cc::after {
  content: "";
  position: absolute;
  right: -30px;
  top: -30px;
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.18);
  border-radius: 50%;
}
.cc::before {
  content: "";
  position: absolute;
  right: 10px;
  top: 30px;
  width: 80px;
  height: 80px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
}
.cc__brand {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 16px;
  z-index: 1;
}
.cc__num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  opacity: 0.85;
  z-index: 1;
}
.cc__balance-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.85;
}
.cc__balance {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 28px;
  line-height: 1;
  z-index: 1;
}
.cc--lilac { background: linear-gradient(135deg, var(--accent-3), var(--primary)); }
.cc--mint  { background: linear-gradient(135deg, var(--accent-2), var(--accent-3)); }

.budget-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  align-items: baseline;
  margin-bottom: 6px;
}
.budget-label { font-weight: 500; }
.budget-amounts {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

/* ----- Gym tracker ----- */
.gym-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.gym-cell {
  aspect-ratio: 1;
  border-radius: 10px;
  background: var(--card-2);
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  transition: all 0.12s;
  flex-direction: column;
  position: relative;
  padding: 6px;
  min-width: 0;
  overflow: hidden;
  text-align: center;
  word-break: break-word;
}
.gym-cell--done {
  background: var(--primary);
  color: white;
  border-color: transparent;
}
.gym-cell--rest {
  background: var(--accent-3-soft);
  color: var(--accent-3);
  border-color: transparent;
}
.gym-cell__day {
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.gym-cell__icon { font-size: 16px; }

/* ----- Journal ----- */
.journal-entry {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  position: relative;
}
.journal-entry__date {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.journal-entry__mood {
  position: absolute;
  top: 14px;
  right: 16px;
  font-size: 18px;
}
.journal-entry__title {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 22px;
  margin: 0 0 6px;
}
.journal-entry__body {
  color: var(--ink-soft);
  line-height: 1.65;
  white-space: pre-wrap;
}
.journal-editor {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  background: var(--card-2);
  margin-bottom: 18px;
}
.journal-editor textarea {
  width: 100%;
  border: 0;
  background: transparent;
  outline: none;
  resize: vertical;
  min-height: 100px;
  font-size: 14px;
  line-height: 1.6;
}
.journal-editor input {
  width: 100%;
  border: 0;
  background: transparent;
  outline: none;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 26px;
  margin-bottom: 8px;
}

/* ----- Recipe ----- */
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.recipe-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: pointer;
}
.recipe-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.recipe-card__img {
  height: 130px;
  display: grid;
  place-items: center;
  font-size: 48px;
  position: relative;
}
.recipe-card__body { padding: 14px; }
.recipe-card__title {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 18px;
  margin: 0 0 4px;
}
.recipe-card__meta {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  gap: 10px;
}
.recipe-fav {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,0.85);
  border: 0;
  border-radius: 50%;
  font-size: 14px;
}

/* ----- Parking lot ----- */
.idea-chip {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.4;
}
.idea-chip__bullet {

  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  margin-top: 7px;
  flex-shrink: 0;
}

.goal-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}

  height: 18px;
  border-radius: 6px;

}
.goal-text { flex: 1; font-size: 13.5px; }
.goal-text--done { color: var(--muted); text-decoration: line-through; }

.weeknav {

/* ----- Editable text ----- */

.editable:focus { background: var(--primary-soft); }
.editable:hover:not(:focus) { background: var(--card-2); }

  top: 50%;
  left: 50%;
  width: 8px;
  height: 12px;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

const NavItem = ({ id, label, icon, active, badge, onClick }) => (

// Editable inline text
const Editable = ({ value, onChange, placeholder = "", style = {}, multiline = false }) => {
  if (multiline) {
    return (
      <textarea
        className="editable"
        value={value}
        placeholder={placeholder}
        rows={Math.max(2, value.split("\n").length)}
        style={{ resize: "none", ...style }}
        onChange={(e) => onChange(e.target.value)}
      />
    );
  }
  return (
    <input
      className="editable"
      value={value}
      placeholder={placeholder}
      style={style}
      onChange={(e) => onChange(e.target.value)}
    />
  );
};

// Confetti burst at coords (x, y), called by tasks/habits on completion
function burstConfetti(x, y) {
  const colors = ["#e8527a", "#f4a261", "#88b896", "#b39bd8", "#f7c548"];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.background = colors[i % colors.length];
    const angle = (i / 16) * Math.PI * 2;
    const dist = 60 + Math.random() * 80;
    el.style.setProperty("--tx", Math.cos(angle) * dist + "px");
    el.style.setProperty("--ty", (Math.sin(angle) * dist + 100) + "px");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }
  // tiny pop via WebAudio
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(660, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.18);
  } catch (e) {}
}

// Reusable card head
const CardHead = ({ title, sub, right }) => (
  <div className="card__head">
    <div>
      <h3 className="card__title">{title}</h3>
      {sub && <div className="card__sub mt-sm">{sub}</div>}
    </div>
    {right}
  </div>
);

const Bar = ({ value, max = 100, color }) => (
  <div className="bar">
    <div className="bar__fill" style={{
      width: Math.min(100, (value / max) * 100) + "%",
      ...(color ? { background: color } : {})
    }}/>
  </div>
);

const Pill = ({ tone = "pink", mono = false, children }) => (
  <span className={cls("pill", `pill--${tone}`, mono && "pill--mono")}>{children}</span>
);

Object.assign(window, { Icon, NavItem, Editable, burstConfetti, CardHead, Bar, Pill });

    return `${fmt(mon)} – ${fmt(sun)}`;

      {/* Day labels row */}
      <div className="habit-row" style={{ marginBottom: 4 }}>
        <div></div>
        {DAYS_OF_WEEK.map((d, i) => (
          <div key={d} className="habit-day-head">{d}<br/><span style={{ fontSize: 9, opacity: 0.7 }}>{(() => { const now = new Date(); const day = now.getDay(); const diff = (day === 0 ? -6 : 1 - day) + i; const dt = new Date(now); dt.setDate(now.getDate() + diff); return dt.getDate(); })()}</span></div>
        ))}
        <div className="habit-day-head">Score</div>
      </div>

      <div className="habit-grid">
        {items.map(h => {
          const log = habitLogs[h.id];
          const count = log.filter(Boolean).length;
          const hit = count >= h.goal;
          return (
            <div key={h.id} className="habit-row">
              <div className="habit-row__head">
                <span className="habit-row__icon" style={{ background: h.bg, color: h.color }}>{h.icon}</span>
                <div style={{ minWidth: 0 }}>
                  <div style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.label}</div>
                  <div className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.06em" }}>goal {h.goal}/wk</div>
                </div>
              </div>
              {log.map((done, i) => (
                <button
                  key={i}
                  className={cls("habit-cell", done && "habit-cell--done", i === (new Date().getDay() + 6) % 7 && "habit-cell--today")}
                  style={done ? { background: h.color, color: "white" } : {}}
                  onClick={(e) => toggleCell(h.id, i, e)}
                >
                  {done ? "✓" : ""}
                </button>
              ))}
              <div className="habit-row__score" style={{ color: hit ? h.color : "var(--ink-soft)", fontWeight: hit ? 700 : 500 }}>
                {count}/{h.goal}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // Summary cards
  const summary = habits.map(h => {
    const count = habitLogs[h.id].filter(Boolean).length;
    return { ...h, count, percent: pct(count, h.goal) };
  });

  return (
    <>
      <div className="page-head">
        <div>
          <div className="page-head__greeting">Habits · {(() => { const now = new Date(); const d = now.getDay(); const diff = d === 0 ? -6 : 1 - d; const mon = new Date(now); mon.setDate(now.getDate() + diff); const sun = new Date(mon); sun.setDate(mon.getDate() + 6); const f = x => x.toLocaleDateString("en-US",{month:"short",day:"numeric"}); return `${f(mon)} – ${f(sun)}`; })()}</div>
          <h1 className="page-head__title">Habit tracker</h1>
        </div>
        <div className="row gap-md">
          <div className="card" style={{ padding: "10px 18px", display: "flex", alignItems: "baseline", gap: 10 }}>
            <span className="text-serif" style={{ fontSize: 28, color: "var(--primary)" }}>{overallPct}%</span>
            <span className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.1em" }}>this week</span>
          </div>
        </div>
      </div>

      {/* Summary cards row */}
      <div className="bento" style={{ marginBottom: 0 }}>
        {summary.slice(0, 5).map(h => (
          <div key={h.id} className="card col-3" style={{ background: h.bg, borderColor: "transparent", padding: 16 }}>
            <div className="row" style={{ marginBottom: 8 }}>
              <span className="habit-row__icon" style={{ background: "white", color: h.color }}>{h.icon}</span>
              <span className="text-mono fs-xs" style={{ color: h.color, fontWeight: 600 }}>{h.percent}%</span>
            </div>
            <div style={{ fontSize: 13, fontWeight: 500, color: "var(--ink)" }}>{h.label}</div>
            <div className="text-mono fs-xs" style={{ color: h.color, opacity: 0.8, marginTop: 2, letterSpacing: "0.06em" }}>
              {h.count}/{h.goal}
            </div>
          </div>
        ))}
      </div>

      <Section title="Daily" items={daily} />
      <Section title="Devotional" items={devo} />
    </>
  );
};

window.HabitsView = HabitsView;

</script>
<script type="text/babel">
// Quarter view — goals + parking lot + quarterly stats

const QuarterView = ({ state, setState }) => {
  const { quarterGoals, parking } = state;

  const categories = ["Health", "Finance", "Business", "Personal"];
  const catColor = {
    Health:   { bg: "var(--primary-soft)",  text: "var(--primary-deep)",  accent: "var(--primary)" },
    Finance:  { bg: "var(--accent-2-soft)", text: "#3d6b4f",              accent: "var(--accent-2)" },
    Business: { bg: "var(--accent-3-soft)", text: "#5e4b85",              accent: "var(--accent-3)" },
    Personal: { bg: "var(--accent-1-soft)", text: "#8b4f1c",              accent: "var(--accent-1)" },
  };

  const toggleGoal = (id, e) => {
    if (e && !quarterGoals.find(g => g.id === id).done) {
      const r = e.currentTarget.getBoundingClientRect();
      burstConfetti(r.left + r.width / 2, r.top + r.height / 2);
    }
    setState(s => ({ ...s, quarterGoals: s.quarterGoals.map(g => g.id === id ? { ...g, done: !g.done } : g) }));
  };

  const editGoal = (id, text) => {
    setState(s => ({ ...s, quarterGoals: s.quarterGoals.map(g => g.id === id ? { ...g, text } : g) }));
  };

  const addGoal = (cat) => {
    setState(s => ({ ...s, quarterGoals: [...s.quarterGoals, { id: "g" + Date.now(), category: cat, text: "New goal", done: false }] }));
  };

  const addParking = () => {
    setState(s => ({ ...s, parking: ["New idea", ...s.parking] }));
  };

  const editParking = (i, text) => {
    setState(s => ({ ...s, parking: s.parking.map((p, j) => j === i ? text : p) }));
  };

  const removeParking = (i) => {
    setState(s => ({ ...s, parking: s.parking.filter((_, j) => j !== i) }));
  };

  const totalDone = quarterGoals.filter(g => g.done).length;
  const totalPct = pct(totalDone, quarterGoals.length);

  return (
    <>
      <div className="page-head">
        <div>
          <div className="page-head__greeting">Q2 · April – June 2026</div>

            <span className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.1em" }}>quarter complete</span>
          </div>
        </div>
      </div>

      <div className="bento">
        {/* Quarter at-a-glance */}
        <div className="card col-12 card--tinted">
          <div className="bento" style={{ gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
            {[
              { label: "Goals completed", value: `${totalDone}/${quarterGoals.length}`, sub: "across 4 categories" },
              { label: "Books read",      value: "4",                   sub: "of 6 target" },
              { label: "Gym sessions",    value: "47",                  sub: "vs 52 target" },
              { label: "Savings added",   value: "$2,180",              sub: "this quarter" },
            ].map((s, i) => (
              <div key={i}>
                <div className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.12em", textTransform: "uppercase" }}>{s.label}</div>
                <div className="text-serif" style={{ fontSize: 36, color: "var(--ink)", marginTop: 4 }}>{s.value}</div>
                <div className="fs-xs text-muted">{s.sub}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Goal categories */}
        {categories.map(cat => {
          const items = quarterGoals.filter(g => g.category === cat);
          const done = items.filter(g => g.done).length;
          const c = catColor[cat];
          return (
            <div key={cat} className="card col-6">
              <CardHead
                title={cat}
                sub={`${done} / ${items.length} goals`}
                right={<button className="btn btn--icon" onClick={() => addGoal(cat)}><Icon name="plus" size={14}/></button>}
              />
              <Bar value={done} max={items.length || 1} color={c.accent} />
              <div className="mt-md">
                {items.map(g => (
                  <div key={g.id} className="goal-row">
                    <button
                      className={cls("goal-check", g.done && "goal-check--done")}
                      style={g.done ? { background: c.accent, borderColor: c.accent } : {}}
                      onClick={(e) => toggleGoal(g.id, e)}
                    >
                      {g.done && <Icon name="check" size={11} stroke={2.6}/>}
                    </button>
                    <Editable
                      value={g.text}
                      onChange={(v) => editGoal(g.id, v)}
                      style={{ fontSize: 13.5, color: g.done ? "var(--muted)" : "var(--ink)", textDecoration: g.done ? "line-through" : "none" }}
                    />
                  </div>
                ))}
                {items.length === 0 && <div className="empty">no goals yet — add one</div>}
              </div>
            </div>
          );
        })}

        {/* Parking lot */}
        <div className="card col-7 card--lilac">
          <CardHead
            title="Parking lot"
            sub="Ideas to come back to"
            right={<button className="btn btn--icon" onClick={addParking}><Icon name="plus" size={14}/></button>}
          />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 8 }}>
            {parking.map((p, i) => (
              <div key={i} className="idea-chip" style={{ background: "rgba(255,255,255,0.7)" }}>
                <span className="idea-chip__bullet"/>
                <Editable value={p} onChange={(v) => editParking(i, v)} style={{ fontSize: 13 }}/>
                <button className="btn btn--ghost" style={{ padding: 2 }} onClick={() => removeParking(i)}>
                  <Icon name="x" size={11}/>
                </button>
              </div>
            ))}
          </div>
        </div>

        {/* Achievements */}
        <div className="card col-5 card--peach">
          <CardHead
            title="Wins this quarter"
            sub="What you're proud of"
            right={<button className="btn btn--icon"><Icon name="plus" size={14}/></button>}
          />
          <div className="col gap-sm">
            {[
              { txt: "Hit 4 weeks straight of pilates 🌸", color: "var(--primary)" },
              { txt: "Paid off the small Amex card 💸",     color: "var(--accent-2)" },
              { txt: "Finished my morning routine system ✨", color: "var(--accent-3)" },
              { txt: "Sonoma weekend was actually restful 🍇", color: "var(--accent-1)" },
            ].map((w, i) => (
              <div key={i} className="idea-chip" style={{ background: "rgba(255,255,255,0.75)" }}>
                <span className="idea-chip__bullet" style={{ background: w.color }}/>
                <span>{w.txt}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
};

window.QuarterView = QuarterView;

</script>
<script type="text/babel">
// Finance + budget view

const FinanceView = ({ state, setState }) => {
  const { cards, budget, savings, transactions } = state;
  const [txOpen, setTxOpen] = useState(false);
  const [editingTx, setEditingTx] = useState(null);

  // Compute budget spending from transactions instead of static field
  const liveBudget = budget.map(b => {
    const txSpent = transactions
      .filter(t => t.category === b.category && t.amount < 0)
      .reduce((sum, t) => sum + Math.abs(t.amount), 0);
    return { ...b, spent: txSpent || b.spent };
  });

  const totalDebt = cards.reduce((s, c) => s + c.balance, 0);
  const totalLimit = cards.reduce((s, c) => s + c.limit, 0);
  const totalSpent = liveBudget.reduce((s, b) => s + b.spent, 0);
  const totalBudget = liveBudget.reduce((s, b) => s + b.budget, 0);
  const totalSaved = savings.reduce((s, x) => s + x.saved, 0);
  const totalSavingsGoal = savings.reduce((s, x) => s + x.goal, 0);
  const income = transactions.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);

  return (
    <>
      <div className="page-head">
        <div>
          <div className="page-head__greeting">Finance · May 2026</div>
          <h1 className="page-head__title">Money & vibes</h1>
        </div>
        <div className="row gap-md">
          <Pill tone="pink" mono>{currency(totalDebt)} owed</Pill>
          <Pill tone="mint" mono>{currency(totalSaved)} saved</Pill>
          <Pill tone="lilac" mono>{Math.round(((totalBudget - totalSpent) / totalBudget) * 100)}% budget left</Pill>
          <button className="btn btn--pink" onClick={() => { setEditingTx(null); setTxOpen(true); }}>
            <Icon name="plus" size={14}/> Log transaction
          </button>
        </div>
      </div>

      <div className="bento">
        {/* Top stats */}
        <div className="card col-12 card--tinted">
          <div className="bento" style={{ gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
            {[
              { label: "Net worth",          value: currency(totalSaved - totalDebt), sub: "this month",         tone: "var(--primary)" },
              { label: "Spent this month",   value: currency(totalSpent),             sub: `of ${currency(totalBudget)}`, tone: "var(--accent-1)" },
              { label: "Total saved",        value: currency(totalSaved),             sub: `of ${currency(totalSavingsGoal)} goal`, tone: "var(--accent-2)" },
              { label: "Credit utilization", value: Math.round(totalDebt / totalLimit * 100) + "%", sub: `${currency(totalDebt)} / ${currency(totalLimit)}`, tone: "var(--accent-3)" },
            ].map((s, i) => (
              <div key={i}>
                <div className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.12em", textTransform: "uppercase" }}>{s.label}</div>
                <div className="text-serif" style={{ fontSize: 36, color: s.tone, marginTop: 4 }}>{s.value}</div>
                <div className="fs-xs text-muted">{s.sub}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Credit cards */}
        <div className="card col-7">
          <CardHead
            title="Credit cards"
            sub={`${cards.length} cards · ${currency(totalDebt)} total`}
            right={<button className="btn btn--icon"><Icon name="plus" size={14}/></button>}
          />
          <div className="bento" style={{ gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
            {cards.map(c => {
              const util = pct(c.balance, c.limit);
              const gradMap = {
                "var(--primary)":   "linear-gradient(135deg, var(--primary), var(--accent-1))",
                "var(--accent-3)":  "linear-gradient(135deg, var(--accent-3), var(--primary))",
                "var(--accent-1)":  "linear-gradient(135deg, var(--accent-1), var(--accent-4))",
              };
              return (
                <div key={c.id} className="cc" style={{ background: gradMap[c.color] || gradMap["var(--primary)"] }}>
                  <div className="row row--between" style={{ zIndex: 1 }}>
                    <div className="cc__brand">{c.name}</div>
                    <div style={{ width: 28, height: 18, borderRadius: 4, background: "rgba(255,255,255,0.3)" }}/>
                  </div>
                  <div style={{ zIndex: 1 }}>
                    <div className="cc__balance-label">balance</div>
                    <div className="cc__balance">{currency(c.balance)}</div>
                  </div>
                  <div className="row row--between" style={{ zIndex: 1, fontSize: 10 }}>
                    <span className="cc__num">•••• {c.last4}</span>
                    <span className="cc__num">{util}% used</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Savings goals */}
        <div className="card col-5">
          <CardHead
            title="Savings goals"
            sub={`${savings.length} buckets`}
            right={<button className="btn btn--icon"><Icon name="plus" size={14}/></button>}
          />
          <div className="col gap-md">
            {savings.map(s => (
              <div key={s.id}>
                <div className="row row--between" style={{ marginBottom: 4 }}>
                  <span style={{ fontWeight: 500 }}>{s.name}</span>
                  <span className="text-mono fs-xs text-muted">{currency(s.saved)} / {currency(s.goal)}</span>
                </div>
                <Bar value={s.saved} max={s.goal} color={s.color}/>
                <div className="text-mono fs-xs text-muted mt-sm" style={{ letterSpacing: "0.06em" }}>
                  {pct(s.saved, s.goal)}% · {currency(s.goal - s.saved)} to go
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Budget breakdown */}
        <div className="card col-8">
          <CardHead
            title="Monthly budget"
            sub="May 2026 · 8 days remaining"
            right={
              <div className="row gap-sm">
                <Pill tone="mint" mono>{currency(totalBudget - totalSpent)} left</Pill>
                <button className="btn btn--icon"><Icon name="plus" size={14}/></button>
              </div>
            }
          />
          <div className="col gap-md">
            {liveBudget.map(b => {
              const pctSpent = pct(b.spent, b.budget);
              const over = b.spent > b.budget;
              return (
                <div key={b.id}>
                  <div className="budget-row">
                    <span className="budget-label">{b.category}</span>
                    <span className="budget-amounts">
                      <span style={{ color: over ? "var(--primary)" : "var(--ink)", fontWeight: 600 }}>{currency(b.spent)}</span>
                      <span style={{ margin: "0 4px", color: "var(--muted)" }}>/</span>
                      <span>{currency(b.budget)}</span>
                    </span>
                  </div>
                  <Bar value={Math.min(b.spent, b.budget)} max={b.budget} color={b.color}/>
                </div>
              );
            })}
          </div>
        </div>

        {/* Recent transactions */}
        <div className="card col-4">
          <CardHead
            title="Recent"
            sub={`${transactions.length} transactions`}
            right={<button className="btn btn--icon" onClick={() => { setEditingTx(null); setTxOpen(true); }}><Icon name="plus" size={14}/></button>}
          />
          <div className="col gap-sm" style={{ maxHeight: 360, overflow: "auto" }}>
            {transactions.length === 0 && <div className="empty">No transactions yet</div>}
            {transactions.map(t => (
              <button
                key={t.id}
                className="row"
                style={{
                  padding: "6px 4px",
                  borderBottom: "1px dashed var(--line)",
                  background: "transparent",
                  border: 0,
                  borderRadius: 8,
                  cursor: "pointer",
                  textAlign: "left",
                  width: "100%",
                  fontFamily: "inherit",
                  color: "inherit",
                }}
                onClick={() => { setEditingTx(t); setTxOpen(true); }}
                onMouseEnter={(e) => e.currentTarget.style.background = "var(--card-2)"}
                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
              >
                <span className="habit-row__icon" style={{ background: "var(--card-2)" }}>{t.icon || "💸"}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 500, fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.vendor}</div>
                  <div className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.06em" }}>{t.category} · {t.date}</div>
                </div>
                <div className="text-mono fs-sm" style={{ color: t.amount > 0 ? "var(--accent-2)" : "var(--ink)", fontWeight: 600 }}>
                  {t.amount > 0 ? "+" : "-"}{currency(Math.abs(t.amount))}
                </div>
              </button>
            ))}
          </div>
        </div>
      </div>

      {txOpen && (
        <TransactionModal
          editing={editingTx}
          budget={budget}
          onSave={(tx) => {
            setState(s => ({
              ...s,
              transactions: editingTx
                ? s.transactions.map(t => t.id === editingTx.id ? { ...tx, id: editingTx.id } : t)
                : [{ ...tx, id: "tx" + Date.now() }, ...s.transactions],
            }));
            setTxOpen(false);
            setEditingTx(null);
          }}
          onDelete={editingTx ? () => {
            setState(s => ({ ...s, transactions: s.transactions.filter(t => t.id !== editingTx.id) }));
            setTxOpen(false);
            setEditingTx(null);
          } : null}
          onClose={() => { setTxOpen(false); setEditingTx(null); }}
        />
      )}
    </>
  );
};

window.FinanceView = FinanceView;

// ----------------- Transaction modal -----------------
const TransactionModal = ({ editing, budget, onSave, onDelete, onClose }) => {
  const today = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const [form, setForm] = useState(editing || {
    vendor: "",
    amount: "",
    category: budget[0]?.category || "Groceries",
    icon: "💸",
    date: today,
    type: "expense",
  });
  // Normalize: when amount typed positive, mode (expense/income) decides sign.
  const [type, setType] = useState(editing ? (editing.amount > 0 ? "income" : "expense") : "expense");

  const categories = ["Income", ...budget.map(b => b.category), "Other"];

  const submit = () => {
    const amtNum = parseFloat(form.amount);
    if (!form.vendor.trim() || isNaN(amtNum) || amtNum === 0) return;
    const signed = type === "expense" ? -Math.abs(amtNum) : Math.abs(amtNum);
    onSave({
      vendor: form.vendor.trim(),
      amount: signed,
      category: type === "income" ? "Income" : form.category,
      icon: form.icon || (type === "income" ? "✨" : "💸"),
      date: form.date || today,
    });
  };

  return (
    <div
      style={{ position: "fixed", inset: 0, background: "rgba(58,29,40,0.42)", zIndex: 60, display: "grid", placeItems: "center", padding: 24, backdropFilter: "blur(4px)" }}
      onClick={onClose}>
      <div
        className="card"
        style={{ maxWidth: 500, width: "100%", padding: 0, overflow: "hidden", boxShadow: "var(--shadow-lg)" }}
        onClick={(e) => e.stopPropagation()}>
        <div style={{ height: 6, background: type === "income" ? "var(--accent-2)" : "var(--primary)" }}/>
        <div style={{ padding: 22 }}>
          <div className="row row--between" style={{ alignItems: "flex-start", marginBottom: 18 }}>
            <div>
              <div className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.14em", textTransform: "uppercase" }}>{editing ? "Edit" : "Log"} transaction</div>
              <h3 className="text-serif" style={{ fontSize: 30, margin: "4px 0 0", lineHeight: 1.1 }}>
                {type === "income" ? "Money in" : "What did you spend on?"}
              </h3>
            </div>
            <button className="btn btn--icon" onClick={onClose}><Icon name="x" size={14}/></button>
          </div>

          {/* Expense / Income toggle */}
          <div className="row gap-sm" style={{ marginBottom: 14, background: "var(--card-2)", padding: 4, borderRadius: 12 }}>
            {[
              { id: "expense", label: "Expense", color: "var(--primary)" },
              { id: "income",  label: "Income",  color: "var(--accent-2)" },
            ].map(t => (
              <button
                key={t.id}
                onClick={() => setType(t.id)}
                style={{
                  flex: 1,
                  padding: "8px 12px",
                  borderRadius: 10,
                  border: 0,
                  background: type === t.id ? t.color : "transparent",
                  color: type === t.id ? "white" : "var(--ink-soft)",
                  fontWeight: 600,
                  fontSize: 13,
                  cursor: "pointer",
                  transition: "background 0.15s",

                  fontSize: 16,
                  display: "grid",

                  padding: 0,
                }}>{emo}</button>
            ))}
          </div>

          <div className="row row--between">
            <div>
              {onDelete && (
                <button className="btn btn--ghost" style={{ color: "var(--primary)" }} onClick={onDelete}>
                  <Icon name="trash" size={13}/> Delete

            <div className="row gap-sm">
              <button className="btn btn--ghost" onClick={onClose}>Cancel</button>

};

</script>

<script type="text/babel">
// Content ideas — capture board for newsletter / posts / videos

const ContentView = ({ state, setState }) => {
  const { content } = state;
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterFormat, setFilterFormat] = useState("all");
  const [draftOpen, setDraftOpen] = useState(false);
  const [draft, setDraft] = useState({ title: "", format: "Newsletter", status: "Idea", notes: "" });

  const formats = ["Newsletter", "TikTok", "Instagram", "Blog", "Podcast", "Video"];
  const statuses = ["Idea", "Drafting", "Scheduled", "Published"];

  const formatColor = {
    Newsletter: { bg: "var(--primary-soft)",  text: "var(--primary-deep)", accent: "var(--primary)"   },
    TikTok:     { bg: "var(--accent-3-soft)", text: "#5e4b85",             accent: "var(--accent-3)"  },
    Instagram:  { bg: "var(--accent-1-soft)", text: "#8b4f1c",             accent: "var(--accent-1)"  },
    Blog:       { bg: "var(--accent-2-soft)", text: "#3d6b4f",             accent: "var(--accent-2)"  },
    Podcast:    { bg: "var(--accent-4-soft)", text: "#8a6a16",             accent: "var(--accent-4)"  },
    Video:      { bg: "var(--primary-soft)",  text: "var(--primary-deep)", accent: "var(--primary)"   },
  };

  const statusColor = {
    Idea:       "var(--accent-3)",
    Drafting:   "var(--accent-1)",
    Scheduled:  "var(--accent-4)",
    Published:  "var(--accent-2)",
  };

  const filtered = content.filter(c =>
    (filterStatus === "all" || c.status === filterStatus) &&
    (filterFormat === "all" || c.format === filterFormat)
  );

  const counts = {
    Idea:      content.filter(c => c.status === "Idea").length,
    Drafting:  content.filter(c => c.status === "Drafting").length,
    Scheduled: content.filter(c => c.status === "Scheduled").length,
    Published: content.filter(c => c.status === "Published").length,
  };

  const updateItem = (id, patch) => {
    setState(s => ({ ...s, content: s.content.map(c => c.id === id ? { ...c, ...patch } : c) }));
  };

  const removeItem = (id) => {
    setState(s => ({ ...s, content: s.content.filter(c => c.id !== id) }));
  };

  const cycleStatus = (id) => {
    const item = content.find(c => c.id === id);
    const idx = statuses.indexOf(item.status);
    const next = statuses[(idx + 1) % statuses.length];
    const today = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
    updateItem(id, { status: next, ...(next === "Published" ? { publishedAt: today } : {}) });
  };

  const saveDraft = () => {
    if (!draft.title.trim()) return;
    setState(s => ({
      ...s,
      content: [{ id: "c" + Date.now(), starred: false, tags: [], ...draft }, ...s.content],
    }));
    setDraft({ title: "", format: "Newsletter", status: "Idea", notes: "" });
    setDraftOpen(false);
  };

  const toggleStar = (id) => {
    const item = content.find(c => c.id === id);
    updateItem(id, { starred: !item.starred });
  };

  return (
    <>
      <div className="page-head">
        <div>
          <div className="page-head__greeting">Content · Q2 plan</div>
          <h1 className="page-head__title">Things to make</h1>
          <div className="page-head__date mt-sm">{content.length} pieces in flight · {counts.Published} published this month</div>
        </div>
        <div className="row gap-md">
          <button className="btn btn--pink" onClick={() => setDraftOpen(true)}>
            <Icon name="plus" size={14}/> Capture idea
          </button>
        </div>
      </div>

      {/* Stage counters */}
      <div className="bento" style={{ marginBottom: 0 }}>
        {statuses.map(st => (
          <button
            key={st}
            className={cls("card", "col-3")}
            style={{
              borderColor: filterStatus === st ? statusColor[st] : "var(--line)",
              borderWidth: filterStatus === st ? 2 : 1,
              background: filterStatus === st ? "var(--card-2)" : "var(--card)",
              cursor: "pointer",
              padding: 18,
              textAlign: "left",
              fontFamily: "inherit",
            }}
            onClick={() => setFilterStatus(filterStatus === st ? "all" : st)}
          >
            <div className="row row--between" style={{ marginBottom: 8 }}>
              <span style={{ width: 10, height: 10, borderRadius: "50%", background: statusColor[st] }}/>
              <span className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.1em" }}>{counts[st]} items</span>
            </div>
            <div className="text-serif" style={{ fontSize: 28, color: "var(--ink)", lineHeight: 1 }}>{counts[st]}</div>
            <div className="text-mono fs-xs" style={{ letterSpacing: "0.1em", textTransform: "uppercase", color: statusColor[st], marginTop: 4, fontWeight: 600 }}>{st}</div>
          </button>
        ))}
      </div>

      {/* Format filters */}
      <div className="row gap-sm" style={{ flexWrap: "wrap", margin: "16px 0" }}>
        {["all", ...formats].map(f => (
          <button
            key={f}
            className="pill pill--mono"
            style={{
              cursor: "pointer",
              background: filterFormat === f ? "var(--primary)" : "var(--card)",
              color: filterFormat === f ? "white" : "var(--ink-soft)",
              border: filterFormat === f ? "1px solid var(--primary)" : "1px solid var(--line)",
            }}
            onClick={() => setFilterFormat(f)}
          >
            {f}
          </button>
        ))}
        <span style={{ flex: 1 }}/>
        <Pill tone="lilac" mono>{filtered.length} showing</Pill>
      </div>

      {/* Kanban-ish board: 4 columns by status */}
      <div className="bento">
        {statuses.map(st => {
          const items = (filterStatus === "all" ? content : content.filter(c => c.status === st))
            .filter(c => c.status === st)
            .filter(c => filterFormat === "all" || c.format === filterFormat);
          return (
            <div key={st} className="card col-3" style={{ minHeight: 360, background: "var(--card-2)", padding: 16 }}>
              <div className="row row--between" style={{ marginBottom: 14 }}>
                <div className="row gap-sm">
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: statusColor[st] }}/>
                  <span className="text-mono fs-xs" style={{ letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-soft)", fontWeight: 600 }}>{st}</span>
                </div>
                <span className="text-mono fs-xs text-muted">{items.length}</span>
              </div>

              <div className="col gap-sm">
                {items.length === 0 && (
                  <div className="empty" style={{ padding: "20px 0", border: "1.5px dashed var(--line)", borderRadius: 12 }}>
                    empty · capture one
                  </div>
                )}
                {items.map(c => {
                  const fc = formatColor[c.format] || formatColor.Newsletter;
                  return (
                    <div key={c.id} style={{

<script type="text/babel">
// Main app
const { useState: useS, useEffect: useE } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "strawberry",
  "show": {
    "today": true,
    "week": true,
    "habits": true,
    "quarter": true,
    "finance": true,
    "journal": true,
    "recipes": true,
    "content": true,
    "hair": true,
    "briefing": true
  }
} /*EDITMODE-END*/;

const App = () => {
  const [tweak, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [shortcut, setShortcut] = useS(null);

  const STORAGE_KEY = "dennika-dashboard-v1";

  const _defaultState = {
    page: "today",
    tasks: SEED_TASKS,
    habits: SEED_HABITS,
    habitLogs: SEED_HABIT_LOGS,
    agenda: SEED_AGENDA,
    gymWeek: SEED_GYM_WEEK,
    cards: SEED_CARDS,
    budget: SEED_BUDGET,
    savings: SEED_SAVINGS,
    quarterGoals: SEED_QUARTER_GOALS,
    parking: SEED_PARKING_LOT,
    journal: SEED_JOURNAL,
    recipes: SEED_RECIPES,
    content: SEED_CONTENT,
    transactions: SEED_TRANSACTIONS,
    moodWeek: SEED_MOOD_WEEK,
    hair: { activeWeek: 1, nightlyDone: {}, scalpDays: {} },
    focus: "",
    reflections: { wins: "", push: "" },
    show: TWEAK_DEFAULTS.show
  };

  const [state, setState] = useS(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return { ..._defaultState, ...JSON.parse(saved) };
    } catch (e) {}
    return _defaultState;
  });

  // Persist every state change to localStorage (debounced 400ms)
  const _saveTimer = React.useRef(null);
  useE(() => {
    clearTimeout(_saveTimer.current);
    _saveTimer.current = setTimeout(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }, 400);
  }, [state]);

  // Sync visibility tweaks down into state
  useE(() => {
    setState((s) => ({ ...s, show: tweak.show }));
  }, [tweak.show]);

  // Apply theme on mount + when changed
  useE(() => {
    applyTheme(tweak.theme);
  }, [tweak.theme]);

  const nav = [
  { id: "today", label: "Today", icon: "spark" },
  { id: "week", label: "This week", icon: "week" },
  { id: "habits", label: "Habits", icon: "habit" },
  { id: "quarter", label: "Quarter", icon: "quarter" },
  { id: "finance", label: "Finance", icon: "money" },
  { id: "journal", label: "Journal", icon: "book" },
  { id: "recipes", label: "Kitchen", icon: "chef" },
  { id: "content", label: "Content", icon: "sparkle" },
  { id: "hair", label: "Hair", icon: "leaf" }].
  filter((n) => state.show[n.id] !== false);

  // Counts for sidebar badges
  const openTasks = state.tasks.filter((t) => !t.done).length;
  const badges = {
    today: openTasks,
    week: openTasks
  };

  const VIEWS = {
    today: TodayView,
    week: WeekView,
    habits: HabitsView,
    quarter: QuarterView,
    finance: FinanceView,
    journal: JournalView,
    recipes: RecipesView,
    content: ContentView,
    hair: HairView
  };
  const ActiveView = VIEWS[state.page] || TodayView;

  const setPage = (id) => setState((s) => ({ ...s, page: id }));

  return (
    <div className="app" data-screen-label={state.page}>
      <aside className="sidebar">
        <div className="sidebar__brand">
          <div className="sidebar__brand-mark">D</div>
          <div>
            <div className="sidebar__brand-name">Dennika</div>
            <div className="sidebar__brand-sub">Personal OS · v2</div>
          </div>
        </div>

        <div className="sidebar__section-label">Workspace</div>
        {nav.map((n) =>
        <NavItem
          key={n.id}
          id={n.id}
          label={n.label}
          icon={n.icon}
          active={state.page === n.id}
          badge={badges[n.id]}
          onClick={setPage} />

        )}

        <div className="sidebar__section-label">Shortcuts</div>
        <button className="sidebar__item" data-comment-anchor="5296f3d0d6-button-109-9" onClick={() => setShortcut("mood")}>
          <span className="sidebar__item-icon"><Icon name="heart" /></span>
          <span>Mood check-in</span>
        </button>
        <button className="sidebar__item" onClick={() => setShortcut("briefing")}>
          <span className="sidebar__item-icon"><Icon name="phone" /></span>
          <span>Briefing settings</span>
        </button>

        <div className="sidebar__footer">
          <div className="sidebar__avatar">D</div>
          <div>
            <div className="sidebar__user">Dennika</div>
            <div className="sidebar__streak">14-day streak 🔥</div>
          </div>
        </div>
      </aside>

      <main className="main" data-screen-label={state.page}>
        <ActiveView state={state} setState={setState} />
      </main>

      <DashboardTweaks tweak={tweak} setTweak={setTweak} />
      {shortcut === "mood" && <MoodCheckInModal state={state} setState={setState} onClose={() => setShortcut(null)} />}
      {shortcut === "briefing" && <BriefingSettingsModal onClose={() => setShortcut(null)} />}
    </div>);

};

// ----------------- Shortcut modals -----------------
const Modal = ({ title, sub, onClose, children, accent = "var(--primary)" }) => (
  <div
    style={{ position: "fixed", inset: 0, background: "rgba(58,29,40,0.42)", zIndex: 60, display: "grid", placeItems: "center", padding: 24, backdropFilter: "blur(4px)" }}
    onClick={onClose}>
    <div
      className="card"
      style={{ maxWidth: 460, width: "100%", padding: 0, overflow: "hidden", boxShadow: "var(--shadow-lg)" }}
      onClick={(e) => e.stopPropagation()}>
      <div style={{ height: 6, background: accent }}/>
      <div style={{ padding: 22 }}>
        <div className="row row--between" style={{ alignItems: "flex-start", marginBottom: 18 }}>
          <div>
            <div className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.14em", textTransform: "uppercase" }}>{sub}</div>
            <h3 className="text-serif" style={{ fontSize: 30, margin: "4px 0 0", lineHeight: 1.1 }}>{title}</h3>
          </div>
          <button className="btn btn--icon" onClick={onClose}><Icon name="x" size={14}/></button>
        </div>
        {children}
      </div>
    </div>
  </div>
);

const MoodCheckInModal = ({ state, setState, onClose }) => {
  const [chosen, setChosen] = useS(state.moodWeek[1].emoji);
  const [note, setNote] = useS("");

  const save = () => {
    setState((s) => ({
      ...s,
      moodWeek: s.moodWeek.map((m, i) => i === 1 ? { ...m, emoji: chosen, mood: 4 } : m)
    }));
    onClose();
  };

  return (
    <Modal title="How are you, really?" sub={`Mood check-in · ${new Date().toLocaleDateString("en-US",{weekday:"long"})}`} onClose={onClose}>
      <div className="mood-grid" style={{ gap: 10 }}>
        {MOOD_OPTIONS.map((opt) => {
          const active = chosen === opt.emoji;
          return (
            <button key={opt.id} className="mood-pick" onClick={() => setChosen(opt.emoji)}>
              <span className={cls("mood-emoji", active && "mood-emoji--active")} style={{ width: 48, height: 48, fontSize: 24 }}>{opt.emoji}</span>
              <span className="mood-label">{opt.label}</span>
            </button>);

      </div>

      <div className="mt-lg">
        <div className="text-mono fs-xs text-muted" style={{ letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 6 }}>One-line note (optional)</div>
        <textarea
          value={note}
          onChange={(e) => setNote(e.target.value)}
          placeholder="What's shaping the day?"
          style={{ width: "100%", minHeight: 70, border: "1px solid var(--line)", borderRadius: 12, padding: 12, fontSize: 13.5, lineHeight: 1.5, background: "var(--card-2)", outline: "none", resize: "vertical" }}/>
      </div>

      <div className="row row--between mt-lg">
        <div className="text-mono fs-xs text-muted">Auto-logs to your journal mood trend</div>

          <button className="btn btn--pink" onClick={save}><Icon name="check" size={14}/> Save</button>

const BriefingSettingsModal = ({ onClose }) => {

    weather: true,

    focus: true,
    habits: false,

  });

  const toggle = (k) => setIncludes((i) => ({ ...i, [k]: !i[k] }));

  const include = [

    ["agenda",  "Calendar events"],
    ["tasks",   "Open tasks (1–5)"],
    ["focus",   "Weekly focus"],
    ["habits",  "Today's habit list"],

  return (
    <Modal title="Morning briefing" sub="Settings · sends every morning" onClose={onClose} accent="var(--accent-3)">
